## NasCall — Android SDK location
## Set sdk.dir to your local Android SDK path before building in Android Studio.
##
## Examples:
##   macOS:   sdk.dir=/Users/YOUR_NAME/Library/Android/sdk
##   Windows: sdk.dir=C\:\\Users\\YOUR_NAME\\AppData\\Local\\Android\\Sdk
##   Linux:   sdk.dir=/home/YOUR_NAME/Android/Sdk
##
## Android Studio will also fill this in automatically when you open the project.

sdk.dir=
